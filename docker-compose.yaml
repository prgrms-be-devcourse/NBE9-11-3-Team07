services:
  # 1. 기존 MySQL (이름 유지)
  db:
    image: mysql:8.0
    container_name: moju-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moju_db
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - moju-network

  # 2. Redis Master (기존 단일 노드 → Master로 전환)
  redis-master:
    image: redis:7.2
    container_name: moju-redis-master
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - moju-network

  # 3. Redis Replica (Master 복제본 → 페일오버 대상)
  redis-replica:
    image: redis:7.2
    container_name: moju-redis-replica
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-master 6379
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - moju-network

  # 4. Redis Sentinel 1
  sentinel-1:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    container_name: moju-sentinel-1
    ports:
      - "26379:26379"
    restart: on-failure
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started
    networks:
      - moju-network

  # 5. Redis Sentinel 2
  sentinel-2:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    container_name: moju-sentinel-2
    ports:
      - "26380:26379"
    restart: on-failure
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started
    networks:
      - moju-network

  # 6. Redis Sentinel 3
  sentinel-3:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    container_name: moju-sentinel-3
    ports:
      - "26381:26379"
    restart: on-failure
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started
    networks:
      - moju-network

  # 7. 스프링 부트 애플리케이션
  app:
    build: .
    container_name: moju-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/moju_db?useSSL=false&allowPublicKeyRetrieval=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - db
      - redis-master
      - sentinel-1
      - sentinel-2
      - sentinel-3
    networks:
      - moju-network

  # 8. 프로메테우스
  prometheus:
    image: prom/prometheus:latest
    container_name: moju-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - moju-network

  # 9. 인플럭스디비
  influxdb:
    image: influxdb:1.8
    container_name: moju-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    networks:
      - moju-network

  # 10. 그라파나
  grafana:
    image: grafana/grafana:latest
    container_name: moju-grafana
    ports:
      - "3001:3000"
    networks:
      - moju-network

networks:
  moju-network:
    driver: bridge
services:
  # MySQL: 예약 데이터 저장소
  db:
    image: mysql:8.0
    container_name: moju-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moju_db
    volumes:
      - ./mysql_data:/var/lib/mysql

  # Prometheus: 각 서버 메트릭 수집
  # prometheus.yml에서 mozu-spring 서버 IP 설정 필요
  prometheus:
    image: prom/prometheus:latest
    container_name: moju-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # Grafana: Prometheus 데이터 시각화 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: moju-grafana
    ports:
      - "3000:3000"
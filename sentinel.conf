# Redis Sentinel 설정 파일
# Master 이름: mymaster
# Master 주소: mozu-redis-master 프라이빗 IP
# 과반수: 2 (Sentinel 3대 중 2대 동의 시 페일오버)
# announce-ip는 Dockerfile.sentinel에서 ANNOUNCE_IP 환경변수로 동적 주입

port 26379

# Redis 7.2 공식 호스트네임 지원 옵션
sentinel announce-hostnames yes
sentinel resolve-hostnames yes

# Master 감시 설정 (mozu-redis-master 프라이빗 IP)
sentinel monitor mymaster 172.31.10.231 6379 2

# 5초 동안 응답 없으면 장애로 판단
sentinel down-after-milliseconds mymaster 5000

# 페일오버 타임아웃: 10초
sentinel failover-timeout mymaster 10000

# 페일오버 후 Replica 동기화를 1개씩 순차 진행
sentinel parallel-syncs mymaster 1
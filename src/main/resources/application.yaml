spring:
  application:
    name: mozu

  profiles:
    active: dev

  data:
    redis:
      sentinel:
        # 환경변수로 주입, 기본값은 로컬 Sentinel 설정
        master: ${SPRING_DATA_REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${SPRING_DATA_REDIS_SENTINEL_NODES:localhost:26379,localhost:26380,localhost:26381}

  datasource:
    # 환경변수로 주입, 기본값은 로컬 MySQL 설정
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/moju_db?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: http://localhost:8080/login/oauth2/code/google

jwt:
  secret: ${JWT_SECRET:thisIsATestSecretKeyForLocalDevelopment123456}
  expiration: 1800000
  refresh-expiration: 604800000

# 모니터링 설정
management:
  endpoints:
    web:
      exposure:
        include: "prometheus,info,health,metrics"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
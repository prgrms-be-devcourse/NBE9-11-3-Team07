services:
  # Spring Boot 애플리케이션
  app:
    build: .
    container_name: moju-app
    ports:
      - "8080:8080"
    environment:
      # mozu-db 서버 프라이빗 IP로 MySQL 연결
      - SPRING_DATASOURCE_URL=jdbc:mysql://172.31.7.58:3306/moju_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      # Sentinel 3대 프라이빗 IP로 Redis 연결
      # master: mozu-redis-master / replica: mozu-redis-replica / sentinel: mozu-sentinel
      - SPRING_DATA_REDIS_SENTINEL_MASTER=mymaster
      - SPRING_DATA_REDIS_SENTINEL_NODES=172.31.10.231:26379,172.31.8.38:26379,172.31.11.153:26379
      # Google OAuth2 설정 (환경변수로 주입)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # JWT 설정
      - JWT_SECRET=${JWT_SECRET:thisIsATestSecretKeyForLocalDevelopment123456}
      - JWT_EXPIRATION=1800000
      - JWT_REFRESH_EXPIRATION=604800000